<style>
/* ============================================================
   こども園向けシフト管理 — スタイル
   やわらかい色合いを基調に、時刻・状態・不足箇所の見分けやすさを優先
   ============================================================ */
:root {
  --bg: #FBF7F1;
  --surface: #FFFFFF;
  --surface-2: #F6F1E9;
  --surface-3: #EFE8DD;
  --line: #E6DCCF;
  --line-strong: #D3C6B4;
  --ink: #2A2622;
  --ink-2: #5C554D;
  --ink-3: #887E73;
  --primary: #2C7A67;
  --primary-strong: #215E4F;
  --primary-weak: #E2F0EA;
  --primary-ink: #FFFFFF;
  --accent: #E98B6D;
  --accent-weak: #FCE9E1;

  --sat-bg: #EDF3FB;
  --sat-ink: #2B5D9E;
  --sun-bg: #F1ECE5;
  --sun-ink: #BF3B2A;
  --today: #FFF2BF;
  --today-line: #E3B523;

  --ok: #2D7A4B;
  --ok-bg: #E2F2E6;
  --warn: #9A5600;
  --warn-bg: #FFEFC9;
  --warn-line: #E2A12B;
  --short: #BE2F25;
  --short-bg: #FDE0DB;
  --short-line: #E0574A;
  --na-bg: #F1ECE5;

  --draft: #2160CF;
  --draft-bg: #E5EDFD;
  --pending: #A65200;
  --pending-bg: #FFE8C2;
  --fixed: #3B7A4C;
  --stamp: #D0392D;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(70, 50, 30, .06), 0 4px 14px rgba(70, 50, 30, .08);
  --shadow-lg: 0 10px 40px rgba(50, 35, 20, .22);

  --font-ui: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
  --font-round: 'Zen Maru Gothic', 'BIZ UDPGothic', 'Hiragino Maru Gothic ProN', sans-serif;
  --font-num: 'BIZ UDGothic', 'BIZ UDPGothic', 'Osaka-Mono', 'MS Gothic', monospace;

  --name-w: 136px;
  --cell-w: 60px;
  --cell-h: 54px;
  --time-fs: 12.5px;
  --week-cell-w: 132px;
  --tl-col: 46px;
}
.density-compact { --name-w: 112px; --cell-w: 50px; --cell-h: 44px; --time-fs: 11px; --week-cell-w: 116px; --tl-col: 38px; }
.density-large { --name-w: 150px; --cell-w: 70px; --cell-h: 62px; --time-fs: 14px; --week-cell-w: 150px; --tl-col: 54px; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.boot-loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-2); font-family: var(--font-round); }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--primary-weak); border-top-color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- ヘッダー ---------- */
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--surface); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-text { min-width: 0; }
.brand-title { font-family: var(--font-round); font-weight: 700; font-size: 17px; line-height: 1.2; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; margin-left: 8px; }
.page-tabs button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-family: var(--font-round); font-weight: 700;
  color: var(--ink-2); min-height: 38px; white-space: nowrap;
}
.page-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--primary-strong); box-shadow: var(--shadow); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.user-chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 12px 5px 6px; min-height: 40px; max-width: 280px;
}
.user-chip .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-weak); color: var(--primary-strong); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.user-chip.approver .avatar { background: var(--stamp); color: #fff; }
.user-chip .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.user-chip .who small { color: var(--ink-3); margin-right: 4px; }
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; overflow: hidden; pointer-events: none; }
.progress::after { content: ''; position: absolute; left: -40%; width: 40%; height: 100%; background: var(--accent); animation: prog 1.1s ease-in-out infinite; }
@keyframes prog { to { left: 100%; } }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .seg button:focus-visible, .cell:focus-visible, .chip:focus-visible { outline: 3px solid #8CC5B5; outline-offset: 1px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: var(--primary-strong); }
.btn.stamp { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn.stamp:hover { filter: brightness(.95); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--short); border-color: #EDB5AE; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 42px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .count { background: rgba(0,0,0,.12); border-radius: 999px; padding: 0 7px; font-size: 12px; min-width: 22px; }
.btn.primary .count, .btn.stamp .count { background: rgba(255,255,255,.28); }
.btn.on { background: var(--primary-weak); border-color: var(--primary); color: var(--primary-strong); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 38px; min-width: 52px; padding: 4px 14px; border-radius: 9px; font-weight: 700; color: var(--ink-2); font-family: var(--font-round); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--primary-strong); box-shadow: var(--shadow); }

select.select, input.input, textarea.input {
  min-height: 42px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 6px 10px;
}
select.select { padding-right: 28px; }
textarea.input { width: 100%; min-height: 60px; resize: vertical; }

/* ---------- ツールバー ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 16px; background: var(--bg);
}
.toolbar .grow { flex: 1 1 auto; }
.tgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tgroup.right { margin-left: auto; justify-content: flex-end; }
.date-nav { display: inline-flex; align-items: center; gap: 6px; }
.date-title { position: relative; font-family: var(--font-round); font-weight: 700; font-size: 19px; min-width: 9.5em; text-align: center; padding: 0 4px; cursor: pointer; }
.date-title input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.facility-select { font-family: var(--font-round); font-weight: 700; font-size: 16px; max-width: 240px; }
.status-strip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px; min-height: 44px; }
.status-strip .bar { display: flex; width: 110px; height: 8px; border-radius: 6px; overflow: hidden; background: var(--surface-3); }
.status-strip .bar i { display: block; height: 100%; }
.status-strip .lbl { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.status-strip b { font-family: var(--font-num); }
.stamp-mini { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; font-family: var(--font-round); font-weight: 700; font-size: 11px; line-height: 1.05; text-align: center; transform: rotate(-8deg); flex: none; background: rgba(208,57,45,.04); }
.stamp-mini.empty { border-style: dashed; border-color: var(--line-strong); color: var(--ink-3); transform: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 8px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .sw { width: 16px; height: 14px; border-radius: 3px; border-left: 4px solid; display: inline-block; }
.legend .sep { width: 1px; height: 16px; background: var(--line-strong); }
.legend-toggle { margin-left: auto; }

.filter-row { display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; min-height: 36px; padding: 4px 12px; font-size: 13.5px; white-space: nowrap; font-weight: 700; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }

/* ---------- 判定（充足・要確認・不足） ---------- */
.ck { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 6px; font-weight: 700; font-size: 12px; font-family: var(--font-num); white-space: nowrap; }
.ck.ok { background: var(--ok-bg); color: var(--ok); }
.ck.warn { background: var(--warn-bg); color: var(--warn); }
.ck.short { background: var(--short-bg); color: var(--short); }
.ck.na { background: transparent; color: var(--ink-3); font-weight: 400; }
.ck svg { width: 12px; height: 12px; }

/* ---------- 月・週の表 ---------- */
.grid-wrap {
  margin: 0 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: auto; position: relative; box-shadow: var(--shadow);
  max-height: calc(100vh - 210px); max-height: calc(100dvh - 210px);
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
table.roster { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.roster th, .roster td { padding: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
.roster thead th { position: sticky; z-index: 3; background: var(--surface); }
.roster thead tr.r-date th { top: 0; height: 46px; }
.roster thead tr.r-all th { top: 46px; height: 34px; background: #FCFAF6; border-bottom: 2px solid var(--line-strong); }
.roster .name { position: sticky; left: 0; z-index: 2; width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); text-align: left; padding: 4px 8px; background: var(--surface); }
.roster thead .name { z-index: 5; }
.roster tr.grp .name { z-index: 2; }
.roster .dcol { width: var(--cell-w); min-width: var(--cell-w); }
.roster.week .dcol { width: var(--week-cell-w); min-width: var(--week-cell-w); }
.roster .dcol.closed { width: 30px; min-width: 30px; }
.roster .tot { width: 54px; min-width: 54px; text-align: center; font-size: 12px; }
.roster .tot.h { width: 64px; min-width: 64px; }
.dhead { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; height: 100%; cursor: pointer; border: 0; background: transparent; width: 100%; padding: 2px 0; }
.dhead .d { font-family: var(--font-num); font-size: 15px; font-weight: 700; }
.dhead .w { font-size: 11.5px; color: var(--ink-2); }
.roster.week .dhead { flex-direction: row; gap: 6px; }
.roster.week .dhead .d { font-size: 16px; }
.roster.week .dhead .w { font-size: 13px; }
th.sat, td.sat { background: var(--sat-bg); }
th.sat .w, th.sat .d { color: var(--sat-ink); }
th.sun .w, th.sun .d { color: var(--sun-ink); }
th.closed, td.closed { background: var(--sun-bg) !important; }
th.today { box-shadow: inset 0 -3px 0 var(--today-line); }
th.today .dhead { background: var(--today); }
.closed-label { writing-mode: vertical-rl; font-size: 11px; color: var(--ink-3); letter-spacing: 2px; margin: auto; padding: 4px 0; }
.allck { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; border: 0; background: transparent; padding: 0; }
.roster.week .allck { justify-content: flex-start; gap: 4px; padding: 3px 6px; flex-wrap: wrap; }

.roster tr.grp th, .roster tr.grp td { background: #FAF6EF; height: 30px; }
.roster tr.grp td.sat { background: #EAF0F8; }
.grp-name { display: flex; align-items: center; gap: 6px; font-family: var(--font-round); font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; }
.grp-name .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.grp-name small { font-family: var(--font-ui); font-weight: 400; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.gck { display: flex; align-items: center; justify-content: center; height: 100%; border: 0; background: transparent; width: 100%; padding: 0; }
.roster.week .gck { justify-content: flex-start; padding: 2px 6px; gap: 4px; flex-wrap: wrap; }
.gck .ck { min-width: 20px; height: 20px; font-size: 11px; }
.gck .txt { font-size: 11px; font-family: var(--font-num); color: var(--short); white-space: nowrap; }
.gck .txt.w { color: var(--warn); }

.sname { display: flex; flex-direction: column; justify-content: center; min-height: var(--cell-h); line-height: 1.2; overflow: hidden; }
.sname .n { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sname .j { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
.qual { display: inline-block; font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 4px; border: 1px solid #A9C9BD; color: var(--primary-strong); background: var(--primary-weak); flex: none; }
.qual.no { border-color: #E3C391; color: #8A5A10; background: #FFF5E1; }
.qual.out { border-color: var(--line-strong); color: var(--ink-3); background: var(--surface-2); }

/* 1マス */
.cell {
  position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  width: 100%; height: var(--cell-h); border: 0; margin: 0; padding: 3px 3px 3px 7px; background: transparent; text-align: left;
  border-left: 4px solid transparent; overflow: hidden;
}
.cell:hover { filter: brightness(.97); }
.cell .tg { font-size: 10.5px; font-weight: 700; line-height: 1.1; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.cell .tm { font-family: var(--font-num); font-size: var(--time-fs); font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; white-space: nowrap; color: var(--ink); }
.cell .lv { font-family: var(--font-round); font-weight: 700; font-size: 14px; text-align: center; color: var(--ink-2); }
.cell .mv { position: absolute; right: 2px; bottom: 2px; font-size: 9.5px; line-height: 1; padding: 1px 3px; border-radius: 3px; color: #fff; font-weight: 700; }
.cell .badge { position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 1; padding: 2px 3px; border-radius: 4px; font-weight: 700; }
.cell.st-draft { outline: 2px dashed var(--draft); outline-offset: -3px; }
.cell.st-draft .badge { background: var(--draft); color: #fff; }
.cell.st-pending { box-shadow: inset 0 0 0 2px var(--warn-line); }
.cell.st-pending .badge { background: var(--pending); color: #fff; }
.cell.st-fixed .badge { background: transparent; color: var(--fixed); padding: 0; font-size: 10px; top: 3px; right: 3px; }
.cell.empty { color: var(--ink-3); align-items: center; }
.cell.empty .plus { font-size: 18px; opacity: 0; color: var(--ink-3); }
.cell.empty:hover .plus { opacity: .6; }
.cell.deleting .lv { text-decoration: line-through; color: var(--ink-3); font-size: 11px; }
.cell.warnlabor::after { content: '!'; position: absolute; left: 2px; bottom: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--warn-line); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.roster.week .cell { padding: 5px 6px 5px 9px; justify-content: flex-start; gap: 2px; }
.roster.week .cell .tg { font-size: 12px; }
.roster.week .cell .tm { font-size: calc(var(--time-fs) + 2px); }
.roster.week .cell .sub { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster.week .cell .badge { font-size: 10.5px; padding: 2px 5px; }
.roster.week .cell .mv { position: static; display: inline-block; margin-top: 1px; align-self: flex-start; }
.roster.week { --cell-h: 76px; }
.roster.week .sname { min-height: 76px; }
.roster td.tot { font-family: var(--font-num); color: var(--ink-2); }
.roster tr.srow:hover th.name { background: #FBF8F2; }
.roster tr.foot th, .roster tr.foot td { background: #FCFAF6; height: 30px; font-size: 12px; text-align: center; font-family: var(--font-num); color: var(--ink-2); }

.quick-on .cell { cursor: crosshair; }
.quick-on #page { padding-bottom: 96px; }
.quick-on .grid-wrap { max-height: calc(100vh - 290px); max-height: calc(100dvh - 290px); }
.quick-on .toasts { bottom: 104px; }

/* ---------- 日表示（タイムライン） ---------- */
.day-summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; min-width: 110px; }
.kpi .k { font-size: 12px; color: var(--ink-3); }
.kpi .v { font-family: var(--font-num); font-weight: 700; font-size: 20px; line-height: 1.2; }
.kpi.short .v { color: var(--short); }
.kpi.warn .v { color: var(--warn); }
.kpi.ok .v { color: var(--ok); }
.issues { margin: 0 16px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 6px; }
.issue {
  display: flex; align-items: flex-start; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid; border-radius: 10px;
  padding: 7px 10px; text-align: left; width: 100%;
}
.issue.short { border-left-color: var(--short-line); }
.issue.warn { border-left-color: var(--warn-line); }
.issue .t { font-weight: 700; }
.issue .d { color: var(--ink-2); font-size: 13px; }
.issues-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-round); font-weight: 700; }
.ok-banner { margin: 0 16px 10px; padding: 10px 14px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-weight: 700; }

table.tl { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.tl th, .tl td { padding: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.tl .name { position: sticky; left: 0; z-index: 2; width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); border-right: 1px solid var(--line); text-align: left; padding: 3px 8px; }
.tl thead th { position: sticky; top: 0; z-index: 3; height: 30px; font-size: 12px; font-family: var(--font-num); color: var(--ink-2); text-align: left; padding-left: 3px; border-left: 1px solid var(--line); }
.tl thead th.half { border-left: 1px dotted var(--line); color: transparent; }
.tl thead .name { z-index: 5; }
.tl .tcol { width: var(--tl-col); min-width: var(--tl-col); }
.tl .sec th { background: var(--surface-2); font-family: var(--font-round); font-weight: 700; font-size: 13px; text-align: left; padding: 6px 8px; position: sticky; left: 0; }
.tl .sec td { background: var(--surface-2); }
.tl td.cv { text-align: center; font-family: var(--font-num); font-size: 12px; font-weight: 700; border-left: 1px solid rgba(255,255,255,.7); height: 34px; line-height: 1.05; }
.tl td.cv.ok { background: var(--ok-bg); color: var(--ok); }
.tl td.cv.warn { background: var(--warn-bg); color: var(--warn); }
.tl td.cv.short { background: var(--short-bg); color: var(--short); box-shadow: inset 0 0 0 1px var(--short-line); }
