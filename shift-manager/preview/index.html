<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta charset="utf-8">
  <title>シフト管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   こども園向けシフト管理 — スタイル
   やわらかい色合いを基調に、時刻・状態・不足箇所の見分けやすさを優先
   ============================================================ */
:root {
  --bg: #FBF7F1;
  --surface: #FFFFFF;
  --surface-2: #F6F1E9;
  --surface-3: #EFE8DD;
  --line: #E6DCCF;
  --line-strong: #D3C6B4;
  --ink: #2A2622;
  --ink-2: #5C554D;
  --ink-3: #887E73;
  --primary: #2C7A67;
  --primary-strong: #215E4F;
  --primary-weak: #E2F0EA;
  --primary-ink: #FFFFFF;
  --accent: #E98B6D;
  --accent-weak: #FCE9E1;

  --sat-bg: #EDF3FB;
  --sat-ink: #2B5D9E;
  --sun-bg: #F1ECE5;
  --sun-ink: #BF3B2A;
  --today: #FFF2BF;
  --today-line: #E3B523;

  --ok: #2D7A4B;
  --ok-bg: #E2F2E6;
  --warn: #9A5600;
  --warn-bg: #FFEFC9;
  --warn-line: #E2A12B;
  --short: #BE2F25;
  --short-bg: #FDE0DB;
  --short-line: #E0574A;
  --na-bg: #F1ECE5;

  --draft: #2160CF;
  --draft-bg: #E5EDFD;
  --pending: #A65200;
  --pending-bg: #FFE8C2;
  --fixed: #3B7A4C;
  --stamp: #D0392D;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(70, 50, 30, .06), 0 4px 14px rgba(70, 50, 30, .08);
  --shadow-lg: 0 10px 40px rgba(50, 35, 20, .22);

  --font-ui: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
  --font-round: 'Zen Maru Gothic', 'BIZ UDPGothic', 'Hiragino Maru Gothic ProN', sans-serif;
  --font-num: 'BIZ UDGothic', 'BIZ UDPGothic', 'Osaka-Mono', 'MS Gothic', monospace;

  --name-w: 136px;
  --cell-w: 60px;
  --cell-h: 54px;
  --time-fs: 12.5px;
  --week-cell-w: 132px;
  --tl-col: 46px;
}
.density-compact { --name-w: 112px; --cell-w: 50px; --cell-h: 44px; --time-fs: 11px; --week-cell-w: 116px; --tl-col: 38px; }
.density-large { --name-w: 150px; --cell-w: 70px; --cell-h: 62px; --time-fs: 14px; --week-cell-w: 150px; --tl-col: 54px; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.boot-loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-2); font-family: var(--font-round); }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--primary-weak); border-top-color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- ヘッダー ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-text { min-width: 0; }
.brand-title { font-family: var(--font-round); font-weight: 700; font-size: 17px; line-height: 1.2; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; margin-left: 8px; }
.page-tabs button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-family: var(--font-round); font-weight: 700;
  color: var(--ink-2); min-height: 38px; white-space: nowrap;
}
.page-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--primary-strong); box-shadow: var(--shadow); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.user-chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 12px 5px 6px; min-height: 40px; max-width: 280px;
}
.user-chip .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-weak); color: var(--primary-strong); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.user-chip.approver .avatar { background: var(--stamp); color: #fff; }
.user-chip .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.user-chip .who small { color: var(--ink-3); margin-right: 4px; }
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; overflow: hidden; pointer-events: none; }
.progress::after { content: ''; position: absolute; left: -40%; width: 40%; height: 100%; background: var(--accent); animation: prog 1.1s ease-in-out infinite; }
@keyframes prog { to { left: 100%; } }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .seg button:focus-visible, .cell:focus-visible, .chip:focus-visible { outline: 3px solid #8CC5B5; outline-offset: 1px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: var(--primary-strong); }
.btn.stamp { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.btn.stamp:hover { filter: brightness(.95); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--short); border-color: #EDB5AE; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 42px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .count { background: rgba(0,0,0,.12); border-radius: 999px; padding: 0 7px; font-size: 12px; min-width: 22px; }
.btn.primary .count, .btn.stamp .count { background: rgba(255,255,255,.28); }
.btn.on { background: var(--primary-weak); border-color: var(--primary); color: var(--primary-strong); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 38px; min-width: 52px; padding: 4px 14px; border-radius: 9px; font-weight: 700; color: var(--ink-2); font-family: var(--font-round); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--primary-strong); box-shadow: var(--shadow); }

select.select, input.input, textarea.input {
  min-height: 42px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 6px 10px;
}
select.select { padding-right: 28px; }
textarea.input { width: 100%; min-height: 60px; resize: vertical; }

/* ---------- ツールバー ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 16px; background: var(--bg);
}
.toolbar .grow { flex: 1 1 auto; }
.tgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tgroup.right { margin-left: auto; justify-content: flex-end; }
.date-nav { display: inline-flex; align-items: center; gap: 6px; }
.date-title { position: relative; font-family: var(--font-round); font-weight: 700; font-size: 19px; min-width: 9.5em; text-align: center; padding: 0 4px; cursor: pointer; }
.date-title input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.facility-select { font-family: var(--font-round); font-weight: 700; font-size: 16px; max-width: 240px; }
.status-strip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px; min-height: 44px; }
.status-strip .bar { display: flex; width: 110px; height: 8px; border-radius: 6px; overflow: hidden; background: var(--surface-3); }
.status-strip .bar i { display: block; height: 100%; }
.status-strip .lbl { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.status-strip b { font-family: var(--font-num); }
.stamp-mini { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; font-family: var(--font-round); font-weight: 700; font-size: 11px; line-height: 1.05; text-align: center; transform: rotate(-8deg); flex: none; background: rgba(208,57,45,.04); }
.stamp-mini.empty { border-style: dashed; border-color: var(--line-strong); color: var(--ink-3); transform: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 8px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend .item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .sw { width: 16px; height: 14px; border-radius: 3px; border-left: 4px solid; display: inline-block; }
.legend .sep { width: 1px; height: 16px; background: var(--line-strong); }
.legend-toggle { margin-left: auto; }

.filter-row { display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; min-height: 36px; padding: 4px 12px; font-size: 13.5px; white-space: nowrap; font-weight: 700; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }

/* ---------- 判定（充足・要確認・不足） ---------- */
.ck { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 6px; font-weight: 700; font-size: 12px; font-family: var(--font-num); white-space: nowrap; }
.ck.ok { background: var(--ok-bg); color: var(--ok); }
.ck.warn { background: var(--warn-bg); color: var(--warn); }
.ck.short { background: var(--short-bg); color: var(--short); }
.ck.na { background: transparent; color: var(--ink-3); font-weight: 400; }
.ck svg { width: 12px; height: 12px; }

/* ---------- 月・週の表 ---------- */
.grid-wrap {
  margin: 0 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: auto; position: relative; box-shadow: var(--shadow);
  max-height: calc(100vh - 210px); max-height: calc(100dvh - 210px);
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
table.roster { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.roster th, .roster td { padding: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
.roster thead th { position: sticky; z-index: 3; background: var(--surface); }
.roster thead tr.r-date th { top: 0; height: 46px; }
.roster thead tr.r-all th { top: 46px; height: 34px; background: #FCFAF6; border-bottom: 2px solid var(--line-strong); }
.roster .name { position: sticky; left: 0; z-index: 2; width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); text-align: left; padding: 4px 8px; background: var(--surface); }
.roster thead .name { z-index: 5; }
.roster tr.grp .name { z-index: 2; }
.roster .dcol { width: var(--cell-w); min-width: var(--cell-w); }
.roster.week .dcol { width: var(--week-cell-w); min-width: var(--week-cell-w); }
.roster .dcol.closed { width: 30px; min-width: 30px; }
.roster .tot { width: 54px; min-width: 54px; text-align: center; font-size: 12px; }
.roster .tot.h { width: 64px; min-width: 64px; }
.dhead { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; height: 100%; cursor: pointer; border: 0; background: transparent; width: 100%; padding: 2px 0; }
.dhead .d { font-family: var(--font-num); font-size: 15px; font-weight: 700; }
.dhead .w { font-size: 11.5px; color: var(--ink-2); }
.roster.week .dhead { flex-direction: row; gap: 6px; }
.roster.week .dhead .d { font-size: 16px; }
.roster.week .dhead .w { font-size: 13px; }
th.sat, td.sat { background: var(--sat-bg); }
th.sat .w, th.sat .d { color: var(--sat-ink); }
th.sun .w, th.sun .d { color: var(--sun-ink); }
th.closed, td.closed { background: var(--sun-bg) !important; }
th.today { box-shadow: inset 0 -3px 0 var(--today-line); }
th.today .dhead { background: var(--today); }
.closed-label { writing-mode: vertical-rl; font-size: 11px; color: var(--ink-3); letter-spacing: 2px; margin: auto; padding: 4px 0; }
.allck { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; border: 0; background: transparent; padding: 0; }
.roster.week .allck { justify-content: flex-start; gap: 4px; padding: 3px 6px; flex-wrap: wrap; }

.roster tr.grp th, .roster tr.grp td { background: #FAF6EF; height: 30px; }
.roster tr.grp td.sat { background: #EAF0F8; }
.grp-name { display: flex; align-items: center; gap: 6px; font-family: var(--font-round); font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; }
.grp-name .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.grp-name small { font-family: var(--font-ui); font-weight: 400; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.gck { display: flex; align-items: center; justify-content: center; height: 100%; border: 0; background: transparent; width: 100%; padding: 0; }
.roster.week .gck { justify-content: flex-start; padding: 2px 6px; gap: 4px; flex-wrap: wrap; }
.gck .ck { min-width: 20px; height: 20px; font-size: 11px; }
.gck .txt { font-size: 11px; font-family: var(--font-num); color: var(--short); white-space: nowrap; }
.gck .txt.w { color: var(--warn); }

.sname { display: flex; flex-direction: column; justify-content: center; min-height: var(--cell-h); line-height: 1.2; overflow: hidden; }
.sname .n { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sname .j { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
.qual { display: inline-block; font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 4px; border: 1px solid #A9C9BD; color: var(--primary-strong); background: var(--primary-weak); flex: none; }
.qual.no { border-color: #E3C391; color: #8A5A10; background: #FFF5E1; }
.qual.out { border-color: var(--line-strong); color: var(--ink-3); background: var(--surface-2); }

/* 1マス */
.cell {
  position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  width: 100%; height: var(--cell-h); border: 0; margin: 0; padding: 3px 3px 3px 7px; background: transparent; text-align: left;
  border-left: 4px solid transparent; overflow: hidden;
}
.cell:hover { filter: brightness(.97); }
.cell .tg { font-size: 10.5px; font-weight: 700; line-height: 1.1; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.cell .tm { font-family: var(--font-num); font-size: var(--time-fs); font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; white-space: nowrap; color: var(--ink); }
.cell .lv { font-family: var(--font-round); font-weight: 700; font-size: 14px; text-align: center; color: var(--ink-2); }
.cell .mv { position: absolute; right: 2px; bottom: 2px; font-size: 9.5px; line-height: 1; padding: 1px 3px; border-radius: 3px; color: #fff; font-weight: 700; }
.cell .badge { position: absolute; top: 2px; right: 2px; font-size: 9.5px; line-height: 1; padding: 2px 3px; border-radius: 4px; font-weight: 700; }
.cell.st-draft { outline: 2px dashed var(--draft); outline-offset: -3px; }
.cell.st-draft .badge { background: var(--draft); color: #fff; }
.cell.st-pending { box-shadow: inset 0 0 0 2px var(--warn-line); }
.cell.st-pending .badge { background: var(--pending); color: #fff; }
.cell.st-fixed .badge { background: transparent; color: var(--fixed); padding: 0; font-size: 10px; top: 3px; right: 3px; }
.cell.empty { color: var(--ink-3); align-items: center; }
.cell.empty .plus { font-size: 18px; opacity: 0; color: var(--ink-3); }
.cell.empty:hover .plus { opacity: .6; }
.cell.deleting .lv { text-decoration: line-through; color: var(--ink-3); font-size: 11px; }
.cell.warnlabor::after { content: '!'; position: absolute; left: 2px; bottom: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--warn-line); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.roster.week .cell { padding: 5px 6px 5px 9px; justify-content: flex-start; gap: 2px; }
.roster.week .cell .tg { font-size: 12px; }
.roster.week .cell .tm { font-size: calc(var(--time-fs) + 2px); }
.roster.week .cell .sub { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster.week .cell .badge { font-size: 10.5px; padding: 2px 5px; }
.roster.week .cell .mv { position: static; display: inline-block; margin-top: 1px; align-self: flex-start; }
.roster.week { --cell-h: 76px; }
.roster.week .sname { min-height: 76px; }
.roster td.tot { font-family: var(--font-num); color: var(--ink-2); }
.roster tr.srow:hover th.name { background: #FBF8F2; }
.roster tr.foot th, .roster tr.foot td { background: #FCFAF6; height: 30px; font-size: 12px; text-align: center; font-family: var(--font-num); color: var(--ink-2); }

.quick-on .cell { cursor: crosshair; }
.quick-on #page { padding-bottom: 96px; }
.quick-on .grid-wrap { max-height: calc(100vh - 290px); max-height: calc(100dvh - 290px); }
.quick-on .toasts { bottom: 104px; }

/* ---------- 日表示（タイムライン） ---------- */
.day-summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; min-width: 110px; }
.kpi .k { font-size: 12px; color: var(--ink-3); }
.kpi .v { font-family: var(--font-num); font-weight: 700; font-size: 20px; line-height: 1.2; }
.kpi.short .v { color: var(--short); }
.kpi.warn .v { color: var(--warn); }
.kpi.ok .v { color: var(--ok); }
.issues { margin: 0 16px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 6px; }
.issue {
  display: flex; align-items: flex-start; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid; border-radius: 10px;
  padding: 7px 10px; text-align: left; width: 100%;
}
.issue.short { border-left-color: var(--short-line); }
.issue.warn { border-left-color: var(--warn-line); }
.issue .t { font-weight: 700; }
.issue .d { color: var(--ink-2); font-size: 13px; }
.issues-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-round); font-weight: 700; }
.ok-banner { margin: 0 16px 10px; padding: 10px 14px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-weight: 700; }

table.tl { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.tl th, .tl td { padding: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.tl .name { position: sticky; left: 0; z-index: 2; width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); border-right: 1px solid var(--line); text-align: left; padding: 3px 8px; }
.tl thead th { position: sticky; top: 0; z-index: 3; height: 30px; font-size: 12px; font-family: var(--font-num); color: var(--ink-2); text-align: left; padding-left: 3px; border-left: 1px solid var(--line); }
.tl thead th.half { border-left: 1px dotted var(--line); color: transparent; }
.tl thead .name { z-index: 5; }
.tl .tcol { width: var(--tl-col); min-width: var(--tl-col); }
.tl .sec th { background: var(--surface-2); font-family: var(--font-round); font-weight: 700; font-size: 13px; text-align: left; padding: 6px 8px; position: sticky; left: 0; }
.tl .sec td { background: var(--surface-2); }

<script>
/**
 * Code.gs — Webアプリの入口と、画面から呼ばれる API
 *
 * 画面（Index.html）から google.script.run.api_xxx(req) で呼び出されます。
 * データの保存先は Store.gs（Googleスプレッドシート）です。
 */

// 保存先スプレッドシートのID（空欄なら、このスクリプトを作成したスプレッドシート、またはスクリプトプロパティ SPREADSHEET_ID を使います）
var SPREADSHEET_ID = '';

var APP_TITLE = 'シフト管理';
var TOKEN_HOURS = 6;

function doGet(e) {
  var p = (e && e.parameter) || {};
  var t = HtmlService.createTemplateFromFile('Index');
  t.boot = JSON.stringify({
    page: p.page === 'hq' ? 'hq' : 'facility',
    facilityId: String(p.en || '').replace(/[^\w-]/g, '')
  }).replace(/</g, '\\u003c');

    .setTitle(APP_TITLE)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
}

function include(name) {
  return HtmlService.createHtmlOutputFromFile(name).getContent();
}

// ------------------------------------------------------------------
// 共通
// ------------------------------------------------------------------
function loadMasters_(store) {
  return {
    facilities: store.list('facilities').sort(function (a, b) { return Shared.num(a.order, 99) - Shared.num(b.order, 99); }),
    classes: store.list('classes'),
    staff: store.list('staff'),
    patterns: store.list('patterns'),
    rules: store.list('rules'),
    attendance: store.list('attendance'),
    settings: store.list('settings'),
    accounts: store.list('accounts')

}

function settingsOf_(m) { return Shared.settingsMap(m.settings); }

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { return fn(); } finally { lock.releaseLock(); }
}

function hashPin_(pin) {
  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(pin), Utilities.Charset.UTF_8);
  return bytes.map(function (b) { var v = (b < 0 ? b + 256 : b).toString(16); return v.length < 2 ? '0' + v : v; }).join('');

  stored = String(stored === null || stored === undefined ? '' : stored).trim();
  if (!stored) return false;
  if (stored.indexOf('sha256:') === 0) return stored.slice(7).toLowerCase() === hashPin_(pin);
  return stored === String(pin).trim();
}

function publicUser_(acc) {
  if (!acc) return null;
  return { id: acc.id, name: acc.name, role: acc.role, facilityId: acc.facilityId || '' };
}

/** トークン（ログイン）またはGoogleアカウントのメールから利用者を特定 */
function currentUser_(token, m) {

  var accId = token ? cache.get('tok:' + token) : null;
  var acc = null;
  if (accId) acc = m.accounts.filter(function (a) { return a.id === accId; })[0] || null;
  if (acc) return { acc: acc, token: token };
  var email = '';
  try { email = String(Session.getActiveUser().getEmail() || '').toLowerCase(); } catch (e) { email = ''; }
  if (email) {
    acc = m.accounts.filter(function (a) { return String(a.email || '').toLowerCase() === email; })[0] || null;
    if (acc) {
      var t = Utilities.getUuid();
      cache.put('tok:' + t, acc.id, TOKEN_HOURS * 3600);
      return { acc: acc, token: t };
    }
  }

}

function canApprove_(acc, facilityId) {
  if (!acc) return false;
  if (acc.role === '本部') return true;
  return (acc.role === '園長' || acc.role === '主任') && acc.facilityId === facilityId;
}

function requireApprover_(req, m, facilityId) {
  var u = currentUser_(req.token, m);
  if (!u) throw new Error('LOGIN_REQUIRED: 承認印を押すには、園長・主任・本部のアカウントでログインしてください。');

// ------------------------------------------------------------------
// API
// ------------------------------------------------------------------

/** 画面の初期表示に必要なマスタ類と、ログイン状態 */
function api_bootstrap(req) {
  req = req || {};

    today: Shared.todayJST(),
    now: Shared.nowJST(),

    token: u ? u.token : '',

function api_login(req) {

  var cache = CacheService.getScriptCache();
  var failKey = 'fail:' + req.accountId;

}

/** 期間内の勤務 */
function api_getShifts(req) {
  req = req || {};
  if (!validDate_(req.from) || !validDate_(req.to)) throw new Error('期間の指定が正しくありません。');
  var store = getStore_();
  var list = store.list('shifts').filter(function (s) {
    return s.facilityId === req.facilityId && s.date >= req.from && s.date <= req.to;
  });
  return { shifts: list, now: Shared.nowJST() };
}

/**
 * 勤務の保存（1件でも複数でも）。保存した勤務は「変更中」になります。
 * item: { staffId, date, type, kind, start, end, breakStart, breakMin, classId, segments, note, clear, base }
 *   base … 画面が読み込んだ時点の入力日時。他の人が先に変更していたら conflicts に入ります。
 */
function api_saveShifts(req) {
  req = req || {};
  var items = req.items || [];
  if (!items.length) return { saved: [], deleted: [], conflicts: [] };
  return withLock_(function () {
    var store = getStore_();
    var m = loadMasters_(store);
    var u = currentUser_(req.token, m);
    var editor = u ? u.acc.name : String(req.editor || '').slice(0, 40) || '（未入力）';
    var now = Shared.nowJST();
    var all = store.list('shifts');
    var byId = {};
    all.forEach(function (s) { byId[s.id] = s; });
    var staffById = {};
    m.staff.forEach(function (s) { staffById[s.id] = s; });
    var patByName = {};
    Shared.patternsFor(m, req.facilityId).forEach(function (p) { patByName[p.name] = p; });
    var saved = [], deleted = [], conflicts = [], logs = [];

    items.forEach(function (it) {
      if (!validDate_(it.date)) return;
      var staff = staffById[it.staffId];
      if (!staff || staff.facilityId !== req.facilityId) return;
      var id = it.date + '_' + it.staffId;
      var cur = byId[id] || null;
      if (it.base !== undefined && it.base !== null) {
        var curStamp = cur ? String(cur.editedAt || '') : '';
        if (curStamp !== String(it.base || '')) { conflicts.push({ id: id, current: cur }); return; }
      }
      var before = cur ? Shared.shiftText(cur) : '';
      if (it.clear) {
        if (!cur) return;
        if (cur.status === Shared.STATUS.FIXED || cur.prevFixed) {
          var del = {};
          for (var k in cur) del[k] = cur[k];
          del.type = ''; del.kind = ''; del.start = ''; del.end = ''; del.breakStart = ''; del.breakMin = 0;
          del.segments = ''; del.prevFixed = cur.prevFixed || (cur.status === Shared.STATUS.FIXED ? Shared.shiftText(cur) : '');
          del.status = Shared.STATUS.DRAFT; del.editor = editor; del.editedAt = now; del.approver = ''; del.approvedAt = '';
          decorateShift_(del, m);
          saved.push(del); byId[id] = del;
          logs.push({ at: now, action: '削除（承認待ちへ）', facilityId: req.facilityId, shiftId: id, date: it.date, staffName: staff.name, before: before, after: '（削除）', by: editor, note: '' });
        } else {
          deleted.push(id); delete byId[id];
          logs.push({ at: now, action: '削除', facilityId: req.facilityId, shiftId: id, date: it.date, staffName: staff.name, before: before, after: '', by: editor, note: '' });
        }
        return;
      }
      var pat = patByName[it.type] || null;
      var kind = it.kind || (pat ? pat.kind : Shared.KIND.WORK);
      var isWork = kind === Shared.KIND.WORK || kind === Shared.KIND.TRAIN;
      var rec = {
        id: id, facilityId: req.facilityId, date: it.date, staffId: it.staffId,
        type: String(it.type || '').slice(0, 20), kind: kind,
        start: isWork ? cleanTime_(it.start) : '', end: isWork ? cleanTime_(it.end) : '',
        breakStart: isWork ? cleanTime_(it.breakStart) : '', breakMin: isWork ? Math.max(0, Math.min(240, Number(it.breakMin) || 0)) : 0,
        classId: String(it.classId || ''), segments: isWork ? Shared.formatSegments(Shared.parseSegments(it.segments)) : '',
        note: String(it.note || '').slice(0, 200),
        status: Shared.STATUS.DRAFT, editor: editor, editedAt: now, approver: '', approvedAt: '',
        prevFixed: cur ? (cur.prevFixed || (cur.status === Shared.STATUS.FIXED ? Shared.shiftText(cur) : '')) : ''
      };
      if (isWork && (!rec.start || !rec.end)) throw new Error(staff.name + ' ' + it.date + '：出勤・退勤の時刻を入れてください。');
      if (isWork && Shared.toMin(rec.end) <= Shared.toMin(rec.start)) throw new Error(staff.name + ' ' + it.date + '：退勤は出勤より後の時刻にしてください。');
      // 内容が同じなら何もしない
      if (cur && ['type', 'kind', 'start', 'end', 'breakStart', 'breakMin', 'classId', 'segments', 'note'].every(function (k) { return String(cur[k] === undefined ? '' : cur[k]) === String(rec[k]); })) {
        saved.push(cur);
        return;
      }
      decorateShift_(rec, m);
      saved.push(rec); byId[id] = rec;
      logs.push({ at: now, action: cur ? '変更' : '入力', facilityId: req.facilityId, shiftId: id, date: it.date, staffName: staff.name, before: before, after: Shared.shiftText(rec), by: editor, note: rec.note });
    });

    if (saved.length) store.upsert('shifts', saved);
    if (deleted.length) store.remove('shifts', deleted);
    if (logs.length) store.append('history', logs);
    return { saved: saved, deleted: deleted, conflicts: conflicts, now: now };
  });
}

/** 変更中 → 承認待ち（だれでも可） */
function api_requestApproval(req) {
  req = req || {};
  return withLock_(function () {
    var store = getStore_();
    var m = loadMasters_(store);
    var u = currentUser_(req.token, m);
    var editor = u ? u.acc.name : String(req.editor || '').slice(0, 40) || '（未入力）';
    var now = Shared.nowJST();
    var ids = {};
    (req.ids || []).forEach(function (id) { ids[id] = true; });
    var targets = store.list('shifts').filter(function (s) {
      return s.facilityId === req.facilityId && s.status === Shared.STATUS.DRAFT && ids[s.id];
    });
    targets.forEach(function (s) { s.status = Shared.STATUS.PENDING; s.editedAt = now; });
    if (targets.length) {
      store.upsert('shifts', targets);
      store.append('history', [{ at: now, action: '承認依頼', facilityId: req.facilityId, shiftId: '', date: '', staffName: '', before: '', after: targets.length + '件', by: editor, note: String(req.message || '').slice(0, 200) }]);
    }
    return { updated: targets, now: now };
  });
}

/** 承認印：承認待ち（・変更中）→ 確定。園長・主任・本部のみ */
function api_approve(req) {
  req = req || {};
  return withLock_(function () {
    var store = getStore_();
    var m = loadMasters_(store);
    var acc = requireApprover_(req, m, req.facilityId);
    var now = Shared.nowJST();
    var ids = {};
    (req.ids || []).forEach(function (id) { ids[id] = true; });
    var updated = [], deleted = [];
    store.list('shifts').forEach(function (s) {
      if (s.facilityId !== req.facilityId || !ids[s.id] || s.status === Shared.STATUS.FIXED) return;
      if (!s.type && !Shared.hasTimes(s)) { deleted.push(s.id); return; }
      s.status = Shared.STATUS.FIXED; s.approver = acc.name; s.approvedAt = now; s.prevFixed = '';
      updated.push(s);
    });
    if (updated.length) store.upsert('shifts', updated);
    if (deleted.length) store.remove('shifts', deleted);
    if (updated.length || deleted.length) {
      store.append('history', [{ at: now, action: '承認（確定）', facilityId: req.facilityId, shiftId: '', date: '', staffName: '', before: '', after: (updated.length + deleted.length) + '件', by: acc.name, note: '' }]);
    }
    return { updated: updated, deleted: deleted, approver: acc.name, now: now };
  });
}

/** 差戻し：承認待ち → 変更中（理由を備考に追記）。園長・主任・本部のみ */
function api_sendBack(req) {
  req = req || {};
  return withLock_(function () {
    var store = getStore_();
    var m = loadMasters_(store);
    var acc = requireApprover_(req, m, req.facilityId);
    var now = Shared.nowJST();
    var ids = {};
    (req.ids || []).forEach(function (id) { ids[id] = true; });
    var reason = String(req.reason || '').slice(0, 100);
    var updated = store.list('shifts').filter(function (s) {
      return s.facilityId === req.facilityId && ids[s.id] && s.status === Shared.STATUS.PENDING;
    });
    updated.forEach(function (s) {
      s.status = Shared.STATUS.DRAFT; s.editedAt = now;
      s.note = ('【差戻し】' + (reason || '内容を確認してください') + (s.note ? ' / ' + s.note : '')).slice(0, 200);
    });
    if (updated.length) {
      store.upsert('shifts', updated);
      store.append('history', [{ at: now, action: '差戻し', facilityId: req.facilityId, shiftId: '', date: '', staffName: '', before: '', after: updated.length + '件', by: acc.name, note: reason }]);
    }
    return { updated: updated, now: now };
  });
}

/** 変更履歴（新しい順） */
function api_history(req) {
  req = req || {};
  var list = getStore_().list('history').filter(function (h) { return !req.facilityId || h.facilityId === req.facilityId; });
  return list.slice(-Math.min(Number(req.limit) || 100, 300)).reverse();
}

/** 本部画面：園ごとの充足状況・不足箇所・承認状況・勤務時間 */
function api_hqSummary(req) {
  req = req || {};
  if (!validDate_(req.from) || !validDate_(req.to)) throw new Error('期間の指定が正しくありません。');
  var store = getStore_();
  var m = loadMasters_(store);
  var st = settingsOf_(m);
  var u = currentUser_(req.token, m);
  if (Shared.bool(st.hqLoginRequired, false) && !(u && u.acc.role === '本部')) {
    throw new Error('LOGIN_REQUIRED: 本部画面を見るには本部アカウントでログインしてください。');
  }
  var shifts = store.list('shifts').filter(function (s) { return s.date >= req.from && s.date <= req.to; });
  return buildHqSummary_(m, shifts, req.from, req.to);
}

function buildHqSummary_(m, shifts, from, to) {
  var detail = from === to;
  var facilities = m.facilities.map(function (f) {
    var ctx = Shared.buildContext(m, f.id);
    var mine = shifts.filter(function (s) { return s.facilityId === f.id; });
    var days = Shared.evaluateRange(ctx, from, to, mine);
    var counts = { ok: 0, warn: 0, short: 0 };
    var issues = [];
    var dayList = days.map(function (d) {
      counts.ok += d.counts.ok; counts.warn += d.counts.warn; counts.short += d.counts.short;
      d.issues.forEach(function (x) { issues.push(x); });
      var out = { date: d.date, closed: d.closed, worst: d.worst, shortMin: d.shortMin, warnMin: d.warnMin,
        shortCount: d.issues.filter(function (x) { return x.status === 'short'; }).length,
        warnCount: d.issues.filter(function (x) { return x.status === 'warn'; }).length,
        rows: d.rows.map(function (r) { return { key: r.key, label: r.label, worst: r.worst, shortMin: r.shortMin, warnMin: r.warnMin }; }) };
      if (detail) {
        out.times = d.times;
        out.matrix = d.rows.map(function (r) {
          return { key: r.key, label: r.label, color: r.color || '', cells: r.cells.map(function (c) { return [c.st, c.req, c.n, c.q, c.kids]; }) };
        });
      }
      return out;
    });
    var sum = Shared.staffSummary(ctx, mine);
    var workMin = 0, workDays = 0, satDays = 0, paid = 0, warnings = 0;
    sum.forEach(function (r) { workMin += r.workMin; workDays += r.days; satDays += r.satDays; paid += r.paid; warnings += r.warnings; });
    var total = counts.ok + counts.warn + counts.short;
    return {
      id: f.id, name: f.name, kind: f.kind,
      classes: ctx.classes.map(function (c) { return { id: c.id, name: c.name, color: c.color }; }),
      staffCount: ctx.staff.length,
      rate: total ? counts.ok / total : null,
      counts: counts,
      issueCount: { short: issues.filter(function (x) { return x.status === 'short'; }).length, warn: issues.filter(function (x) { return x.status === 'warn'; }).length },
      issues: issues.slice(0, 400),
      days: dayList,
      approval: Shared.statusCounts(mine),
      hours: { workMin: workMin, workDays: workDays, satDays: satDays, paid: paid, laborWarnings: warnings }
    };
  });
  return { from: from, to: to, facilities: facilities, now: Shared.nowJST() };
}

/** 月次集計シートを作成（労務・給与用） */
function api_exportMonthly(req) {
  req = req || {};
  var ym = String(req.ym || Shared.todayJST().slice(0, 7));
  if (!/^\d{4}-\d{2}$/.test(ym)) throw new Error('年月の指定が正しくありません。');
  var from = ym + '-01', to = Shared.monthEnd(from);
  var store = getStore_();
  var m = loadMasters_(store);
  var shifts = store.list('shifts').filter(function (s) { return s.date >= from && s.date <= to; });
  var rows = [];
  m.facilities.forEach(function (f) {
    if (req.facilityId && f.id !== req.facilityId) return;
    var ctx = Shared.buildContext(m, f.id);
    Shared.staffSummary(ctx, shifts.filter(function (s) { return s.facilityId === f.id; })).forEach(function (r) {
      rows.push({ ym: ym, facilityId: f.id, facilityName: f.name, staffId: r.staffId, name: r.name, job: r.job, employment: r.employment,
        days: r.days, satDays: r.satDays, off: r.off, paid: r.paid, train: r.train,
        spanH: Shared.round2(r.spanMin / 60), workH: Shared.round2(r.workMin / 60), fixedWorkH: Shared.round2(r.fixedWorkMin / 60),
        unfixed: r.unfixed, warnings: r.warnings });
    });
  });
  var res = store.writeMonthly(ym, rows);
  return { sheetName: res.sheetName, url: res.url, rows: rows.length };
}

<script>
/* =====================================================================
   シフト管理 — 画面の動き
   ・園の画面（月／週／日）… 職員×日付の一覧、編集、承認、配置チェック
   ・本部の画面 … 複数園の充足状況・不足箇所・勤務時間の比較
   ===================================================================== */
(function () {
  'use strict';
  var S = Shared, ST = S.STATUS, K = S.KIND;

  // ------------------------------------------------------------------
  // 小さな道具
  // ------------------------------------------------------------------
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('shift.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('shift.' + k, JSON.stringify(v)); } catch (e) { /* 保存できなくても続行 */ } }
  };
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function hm(t) { return S.fromMin(t); }
  function hoursText(min) { return (Math.round(min / 6) / 10).toFixed(1); }
  function initial(name) { return String(name || '？').replace(/\s/g, '').slice(0, 1); }
  function surname(name) { return String(name || '').split(/[\s（(]/)[0]; }

  var ICON = {
    ok: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="6" cy="10" r="1.2" fill="currentColor"/></svg>',
    short: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
  };
  var CK_LABEL = { ok: '充足', warn: '要確認', short: '不足', na: '判定なし' };
  function ck(st, text, title) {
    if (!st || st === 'na') return '<span class="ck na" title="' + esc(title || '判定なし') + '">' + (text === undefined ? '—' : esc(text)) + '</span>';
    return '<span class="ck ' + st + '" title="' + esc(title || CK_LABEL[st]) + '">' + ICON[st] + (text ? esc(text) : '') + '<span class="sr-only">' + CK_LABEL[st] + '</span></span>';
  }
  var STATUS_CLASS = {}; STATUS_CLASS[ST.DRAFT] = 'draft'; STATUS_CLASS[ST.PENDING] = 'pending'; STATUS_CLASS[ST.FIXED] = 'fixed';
  function statusPill(status) {
    var c = STATUS_CLASS[status] || 'draft';
    var icon = c === 'fixed' ? '✓ ' : c === 'pending' ? '◷ ' : '✎ ';
    return '<span class="status-pill ' + c + '">' + icon + esc(status || ST.DRAFT) + '</span>';
  }

  // ------------------------------------------------------------------
  // 状態
  // ------------------------------------------------------------------
  var boot = window.BOOT || {};
  var state = {
    m: null, today: S.todayJST(), user: null, token: LS.get('token', ''),
    editor: LS.get('editor', ''),
    page: boot.page || LS.get('page', 'facility'),
    facilityId: boot.facilityId || LS.get('facilityId', ''),
    view: LS.get('view', window.innerWidth < 640 ? 'week' : 'month'),
    anchor: null,
    density: LS.get('density', 'normal'),
    legend: LS.get('legend', window.innerWidth >= 640),
    classFilter: '',
    quick: null,
    shifts: {}, loaded: {}, byDate: null, evalCache: {},
    hq: { view: LS.get('hqView', 'month'), anchor: null, data: null, expanded: {}, filter: 'all', fac: '', loading: false },
    sheetUrl: ''
  };

  // ------------------------------------------------------------------
  // サーバー呼び出し
  // ------------------------------------------------------------------
  var busy = 0;
  function setBusy(d) {
    busy = Math.max(0, busy + d);
    var p = $('#progress');
    if (p) p.classList.toggle('hidden', busy === 0);
  }
  function api(name, req) {
    setBusy(1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { setBusy(-1); resolve(r); })
        .withFailureHandler(function (e) { setBusy(-1); reject(e); })[name](req || {});
    });
  }
  function errMsg(e) {
    var m = (e && (e.message || e)) || 'エラーが発生しました';
    return String(m).replace(/^Error:\s*/, '').replace(/^LOGIN_REQUIRED:\s*/, '');
  }
  function handleErr(e, retry) {
    var m = String((e && e.message) || e || '');
    if (m.indexOf('LOGIN_REQUIRED') >= 0) {
      toast(errMsg(e), 'err');
      openLogin({ reason: errMsg(e), then: retry });
      return;
    }
    toast(errMsg(e), 'err');
    console.error(e);
  }

  // ------------------------------------------------------------------
  // マスタ
  // ------------------------------------------------------------------
  var ctxCache = {};
  function settings() { return S.settingsMap(state.m.settings); }
  function facility(id) { return state.m.facilities.filter(function (f) { return f.id === (id || state.facilityId); })[0]; }
  function classesOf(fid) { return state.m.classes.filter(function (c) { return c.facilityId === fid; }).sort(function (a, b) { return S.num(a.order, 99) - S.num(b.order, 99); }); }
  function classById(id) { return state.m.classes.filter(function (c) { return c.id === id; })[0]; }
  function staffOf(fid) {
    return state.m.staff.filter(function (s) { return s.facilityId === fid && S.bool(s.active, true); })
      .sort(function (a, b) { return S.num(a.order, 999) - S.num(b.order, 999); });
  }
  function staffById(id) { return state.m.staff.filter(function (s) { return s.id === id; })[0]; }
  function patternsOf(fid) { return S.patternsFor(state.m, fid); }
  function patternOf(name, fid) { return patternsOf(fid || state.facilityId).filter(function (p) { return p.name === name; })[0]; }
  function ctxOf(fid) { return ctxCache[fid] || (ctxCache[fid] = S.buildContext(state.m, fid)); }
  function patStyle(s) {
    var p = s && s.type ? patternOf(s.type) : null;
    if (p) return { bg: p.bg || '#F4F1EC', bar: p.bar || '#9A8F82', short: p.short || s.type };
    if (s && s.kind === K.PAID) return { bg: '#FFF6DD', bar: '#C9962A', short: '有' };
    if (s && (s.kind === K.OFF)) return { bg: '#FFFFFF', bar: '#B5ACA1', short: '休' };
    return { bg: '#F4F1EC', bar: '#9A8F82', short: (s && s.type) ? s.type.slice(0, 2) : '' };
  }
  function canApproveHere() {
    var u = state.user;
    if (!u) return false;
    return u.role === '本部' || ((u.role === '園長' || u.role === '主任') && u.facilityId === state.facilityId);
  }

  // ------------------------------------------------------------------
  // 勤務データ（表示中の園）
  // ------------------------------------------------------------------
  function monthsBetween(from, to) {
    var out = [], m = S.monthStart(from);
    while (m <= to) { out.push(m.slice(0, 7)); m = S.addMonths(m, 1); }
    return out;
  }
  function ensureLoaded(from, to, force) {
    var fid = state.facilityId;
    var loaded = state.loaded[fid] || (state.loaded[fid] = {});
    var need = monthsBetween(from, to).filter(function (ym) { return force || !loaded[ym]; });
    if (!need.length) return Promise.resolve(false);
    var f = need[0] + '-01', t = S.monthEnd(need[need.length - 1] + '-01');
    return api('api_getShifts', { facilityId: fid, from: f, to: t }).then(function (res) {
      if (fid !== state.facilityId) return false;
      Object.keys(state.shifts).forEach(function (id) {
        var s = state.shifts[id];
        if (s.date >= f && s.date <= t && !s._local) delete state.shifts[id];
      });
      res.shifts.forEach(function (s) { if (!(state.shifts[s.id] && state.shifts[s.id]._local)) state.shifts[s.id] = s; });
      need.forEach(function (ym) { loaded[ym] = true; });
      dirty();
      return true;
    });
  }
  function dirty(dates) {
    state.byDate = null;
    if (dates) dates.forEach(function (d) { delete state.evalCache[d]; });
    else state.evalCache = {};
  }
  function byDate() {
    if (state.byDate) return state.byDate;
    var m = {};
    Object.keys(state.shifts).forEach(function (id) {
      var s = state.shifts[id];
      if (s.facilityId !== state.facilityId) return;
      (m[s.date] || (m[s.date] = [])).push(s);
    });
    state.byDate = m;
    return m;
  }
  function shiftsOn(date) { return byDate()[date] || []; }
  function getShift(date, staffId) { return state.shifts[date + '_' + staffId] || null; }
  function shiftsIn(from, to) {
    var out = [];
    S.dateRange(from, to).forEach(function (d) { out = out.concat(shiftsOn(d)); });
    return out;
  }
  function evalDay(date) {
    if (!state.evalCache[date]) state.evalCache[date] = S.evaluateDay(ctxOf(state.facilityId), date, shiftsOn(date));
    return state.evalCache[date];
  }
  function applySaved(res) {
    var dates = {};
    (res.saved || res.updated || []).forEach(function (s) { state.shifts[s.id] = s; dates[s.date] = true; });
    (res.deleted || []).forEach(function (id) { var s = state.shifts[id]; if (s) dates[s.date] = true; delete state.shifts[id]; });
    dirty(Object.keys(dates));
  }

  function viewRange(view, anchor) {
    view = view || state.view; anchor = anchor || state.anchor;
    if (view === 'month') return { from: S.monthStart(anchor), to: S.monthEnd(anchor) };
    if (view === 'week') { var w = S.weekStart(anchor); return { from: w, to: S.addDays(w, 6) }; }
    return { from: anchor, to: anchor };
  }
  function rangeTitle(view, anchor) {
    var y = +anchor.slice(0, 4), mo = +anchor.slice(5, 7), d = +anchor.slice(8, 10);
    if (view === 'month') return y + '年' + mo + '月';
    if (view === 'week') { var r = viewRange('week', anchor); return S.mdLabel(r.from) + '〜' + S.mdLabel(r.to); }
    return mo + '月' + d + '日（' + S.DOW[S.dow(anchor)] + '）';
  }

  // ------------------------------------------------------------------
  // 画面の骨組み
  // ------------------------------------------------------------------
  function shell() {
    $('#app').innerHTML =
      '<div class="progress hidden" id="progress"></div>' +
      (window.__PREVIEW__ ? '<div class="preview-banner"><b>プレビュー版</b><span>入力内容はこのブラウザ内に保存されます（GAS版では指定のGoogleスプレッドシートに保存）</span><button data-act="preview-reset">デモデータに戻す</button></div>' : '') +
      '<header class="topbar" id="topbar"></header>' +
      '<div id="page"></div>' +
      '<div id="quick"></div>' +
      '<div class="toasts" id="toasts" aria-live="polite"></div>' +
      '<div id="modals"></div>';
  }
  var BRAND_SVG = '<svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#FCE9E1"/>' +
    '<g fill="#E98B6D"><circle cx="20" cy="11.5" r="5"/><circle cx="28.1" cy="17.4" r="5"/><circle cx="25" cy="26.9" r="5"/><circle cx="15" cy="26.9" r="5"/><circle cx="11.9" cy="17.4" r="5"/></g>' +
    '<circle cx="20" cy="20" r="4.2" fill="#FFD27A"/></svg>';

  function renderTopbar() {
    var st = settings();
    var u = state.user;
    var chip;
    if (u) {
      chip = '<button class="user-chip approver" data-act="user" aria-label="ログイン中のアカウント"><span class="avatar">印</span><span class="who"><small>' + esc(u.role) + '</small>' + esc(u.name) + '</span></button>';
    } else {
      chip = '<button class="user-chip" data-act="user" aria-label="入力者の変更・ログイン"><span class="avatar">' + esc(initial(state.editor || '?')) + '</span><span class="who"><small>入力者</small>' + esc(state.editor || '未選択') + '</span></button>';
    }
    $('#topbar').innerHTML =
      '<div class="brand">' + BRAND_SVG + '<div class="brand-text"><div class="brand-title">シフト管理</div><div class="brand-sub">' + esc(st.orgName || '') + '</div></div></div>' +
      '<nav class="page-tabs" aria-label="画面の切り替え">' +
      '<button data-act="page" data-page="facility" aria-pressed="' + (state.page === 'facility') + '">園の画面</button>' +
      '<button data-act="page" data-page="hq" aria-pressed="' + (state.page === 'hq') + '">本部の画面</button></nav>' +
      '<div class="topbar-right">' + chip + '</div>';
  }

  function render() {
    renderTopbar();
    if (state.page === 'hq') renderHQ();
    else renderFacility();
    renderQuickbar();
  }

  // ------------------------------------------------------------------
  // 園の画面
  // ------------------------------------------------------------------
  function renderFacility() {
    var page = $('#page');
    var keep = keepScroll();
    var r = viewRange();
    page.innerHTML = toolbarHTML(r) + legendHTML() + filterHTML() + '<div id="view"></div>';
    var v = $('#view');
    var loaded = state.loaded[state.facilityId] || {};
    if (monthsBetween(r.from, r.to).some(function (ym) { return !loaded[ym]; })) {
      v.innerHTML = '<div class="empty-note"><div class="spinner" style="margin:0 auto 10px"></div>勤務を読み込んでいます…</div>';
      return;
    }
    if (state.view === 'month') v.innerHTML = rosterHTML(r, 'month');
    else if (state.view === 'week') v.innerHTML = rosterHTML(r, 'week');
    else v.innerHTML = dayHTML(state.anchor);
    document.body.classList.toggle('quick-on', !!state.quick);
    restoreScroll(keep);
  }
  function keepScroll() {
    var g = $('.grid-wrap');
    if (!g) return null;
    return { x: g ? g.scrollLeft : 0, y: g ? g.scrollTop : 0, view: state.view, anchor: state.anchor, fid: state.facilityId, wy: window.scrollY };
  }
  function restoreScroll(k) {
    var g = $('.grid-wrap');
    if (!g) return;
    if (k && k.view === state.view && k.anchor === state.anchor && k.fid === state.facilityId) {
      g.scrollLeft = k.x; g.scrollTop = k.y; window.scrollTo(0, k.wy);
    } else if (state.view === 'month') {
      // 今日の列が見えるように
      var th = $('th.today', g);
      if (th) g.scrollLeft = Math.max(0, th.offsetLeft - g.clientWidth / 3);
    } else if (state.view === 'day') {
      g.scrollLeft = 0;
    }
  }

  function toolbarHTML(r) {
    var fac = facility();
    var counts = S.statusCounts(shiftsIn(r.from, r.to).filter(function (s) { return s.type || S.hasTimes(s) || s.status !== ST.FIXED; }));
    var tot = Math.max(1, counts.total);
    var fixedAll = counts.total > 0 && counts.fixed === counts.total;
    var stamp;
    if (fixedAll) {
      var last = shiftsIn(r.from, r.to).filter(function (s) { return s.approvedAt; }).sort(function (a, b) { return a.approvedAt < b.approvedAt ? 1 : -1; })[0];
      var who = last ? surname(last.approver) : '承認';
      var when = last ? (+last.approvedAt.slice(5, 7)) + '/' + (+last.approvedAt.slice(8, 10)) : '';
      stamp = '<span class="stamp-mini" title="すべて確定済み（' + esc(last ? last.approver : '') + '）">' + esc(who.slice(0, 3)) + '<br>' + esc(when) + '</span>';
    } else {
      stamp = '<span class="stamp-mini empty" title="未確定の勤務があります">未</span>';
    }
    var facOpts = state.m.facilities.map(function (f) {
      return '<option value="' + esc(f.id) + '"' + (f.id === state.facilityId ? ' selected' : '') + '>' + esc(f.name) + '</option>';
    }).join('');
    return '<div class="toolbar"><div class="tgroup">' +
      '<select class="select facility-select" data-change="facility" aria-label="園を選ぶ">' + facOpts + '</select>' +
      '<div class="seg" role="group" aria-label="表示期間">' +
      ['month', 'week', 'day'].map(function (v) { return '<button data-act="view" data-view="' + v + '" aria-pressed="' + (state.view === v) + '">' + { month: '月', week: '週', day: '日' }[v] + '</button>'; }).join('') +
      '</div>' +
      '<div class="date-nav">' +
      '<button class="btn icon" data-act="nav" data-dir="-1" aria-label="前へ">◀</button>' +
      '<label class="date-title" title="日付を選ぶ">' + esc(rangeTitle(state.view, state.anchor)) + '<input type="date" data-change="date" value="' + esc(state.anchor) + '" aria-label="日付を選ぶ"></label>' +
      '<button class="btn icon" data-act="nav" data-dir="1" aria-label="次へ">▶</button>' +
      '<button class="btn small" data-act="nav" data-dir="0">今日</button>' +
      '</div></div>' +
      '<div class="tgroup right">' +
      '<div class="status-strip" title="表示中の期間の承認状況">' + stamp +
      '<div><div class="bar"><i style="width:' + (counts.fixed / tot * 100) + '%;background:var(--fixed)"></i><i style="width:' + (counts.pending / tot * 100) + '%;background:var(--warn-line)"></i><i style="width:' + (counts.draft / tot * 100) + '%;background:var(--draft)"></i></div>' +
      '<div class="lbl">確定 <b>' + counts.fixed + '</b>・承認待ち <b>' + counts.pending + '</b>・変更中 <b>' + counts.draft + '</b></div></div></div>' +
      '<button class="btn" data-act="request"' + (counts.draft ? '' : ' disabled') + '>承認依頼<span class="count">' + counts.draft + '</span></button>' +
      '<button class="btn stamp" data-act="approve">承認印<span class="count">' + counts.pending + '</span></button>' +
      '<button class="btn' + (state.quick ? ' on' : '') + '" data-act="quick" aria-pressed="' + (!!state.quick) + '">かんたん入力</button>' +
      '<button class="btn" data-act="menu" aria-label="その他のメニュー">⋯<span class="lbl-long">メニュー</span></button>' +
      '</div></div>';
  }

  function legendHTML() {
    if (!state.legend) return '<div class="legend"><button class="btn small ghost legend-toggle" data-act="legend">凡例を表示</button></div>';
    var pats = patternsOf(state.facilityId).filter(function (p) { return p.kind === K.WORK || p.kind === K.TRAIN; });
    return '<div class="legend">' +
      pats.map(function (p) {
        return '<span class="item"><span class="sw" style="background:' + esc(p.bg) + ';border-color:' + esc(p.bar) + '"></span>' + esc(p.name) +
          (p.start ? ' <span class="num muted">' + esc(p.start) + '〜' + esc(p.end) + '</span>' : '') + '</span>';
      }).join('') +
      '<span class="sep"></span>' +
      '<span class="item"><span class="status-pill fixed">✓ 確定</span></span>' +
      '<span class="item"><span class="status-pill pending">◷ 承認待ち</span></span>' +
      '<span class="item"><span class="status-pill draft">✎ 変更中</span></span>' +
      '<span class="sep"></span>' +
      '<span class="item">' + ck('ok') + '充足</span><span class="item">' + ck('warn') + '要確認</span><span class="item">' + ck('short') + '不足</span>' +
      '<span class="item"><span class="qual">資</span>有資格</span><span class="item"><span class="qual no">補</span>補助者</span>' +
      '<button class="btn small ghost legend-toggle" data-act="legend">凡例を隠す</button></div>';
  }

  function filterHTML() {
    if (state.view === 'day') return '';
    var cls = classesOf(state.facilityId);
    var chips = '<button class="chip" data-act="cls" data-cls="" aria-pressed="' + (!state.classFilter) + '">全員</button>' +
      cls.map(function (c) {
        return '<button class="chip" data-act="cls" data-cls="' + esc(c.id) + '" aria-pressed="' + (state.classFilter === c.id) + '"><span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</button>';
      }).join('') +
      '<button class="chip" data-act="cls" data-cls="_free" aria-pressed="' + (state.classFilter === '_free') + '">フリー・その他</button>';
    return '<div class="filter-row" role="group" aria-label="クラスで絞り込み">' + chips + '</div>';
  }

  /** 表示する職員のまとまり（クラスごと → フリー → 配置外） */
  function staffGroups(fid, ignoreFilter) {
    var cls = classesOf(fid), staff = staffOf(fid);
    var groups = cls.map(function (c) { return { key: c.id, cls: c, label: c.name, staff: [] }; });
    var byKey = {};
    groups.forEach(function (g) { byKey[g.key] = g; });
    var free = { key: '_free', label: 'フリー・園長・看護師など', staff: [] };
    var out = { key: '_out', label: '配置外（調理・事務など）', staff: [] };
    staff.forEach(function (s) {
      if (!S.bool(s.counted, false)) out.staff.push(s);
      else if (s.classId && byKey[s.classId]) byKey[s.classId].staff.push(s);
      else free.staff.push(s);
    });
    var all = groups.concat([free, out]).filter(function (g) { return g.staff.length || g.cls; });
    if (ignoreFilter) return all;
    if (state.classFilter === '_free') return all.filter(function (g) { return g.key === '_free' || g.key === '_out'; });
    if (state.classFilter) return all.filter(function (g) { return g.key === state.classFilter; });
    return all;
  }

  function classAgeText(c) {
    var n = 0, parts = [];
    for (var a = 0; a <= 5; a++) n += S.num(c['n' + a], 0);
    var ctx = ctxOf(c.facilityId);
    var need = 0;
    for (var b = 0; b <= 5; b++) if (ctx.ratio[b]) need += S.num(c['n' + b], 0) / ctx.ratio[b];
    parts.push((c.ages || '') + ' ' + n + '名');
    parts.push('必要' + Math.max(1, Math.ceil(need - 1e-9)) + '名');
    return parts.join('・');
  }

  function qualBadge(s) {
    if (!S.bool(s.counted, false)) return '<span class="qual out" title="保育の配置には数えません">外</span>';
    return S.bool(s.qualified, false) ? '<span class="qual" title="有資格（保育士・保育教諭など）">資</span>' : '<span class="qual no" title="資格なし（補助者・子育て支援員など）">補</span>';
  }

  function issueCountText(res, rowKey) {
    var list = res.issues.filter(function (x) { return !rowKey || x.rowKey === rowKey; });
    var sh = list.filter(function (x) { return x.status === 'short'; }).length;
    var wn = list.filter(function (x) { return x.status === 'warn'; }).length;
    return { short: sh, warn: wn, list: list };
  }

  // ---------- 月・週の一覧 ----------
  function rosterHTML(r, mode) {
    var fid = state.facilityId;
    var dates = S.dateRange(r.from, r.to);
    var fac = facility();
    var week = mode === 'week';
    var groups = staffGroups(fid);
    var info = dates.map(function (d) {
      var closed = S.closedReason(fac, d);
      var dw = S.dow(d);
      return { d: d, closed: closed, cls: (dw === 6 && !closed ? 'sat' : '') + (closed ? ' closed' + (dw === 0 || S.holidayName(d) ? ' sun' : '') : '') + (d === state.today ? ' today' : ''), res: closed ? null : evalDay(d) };
    });

    var h = '<div class="grid-wrap" id="grid"><table class="roster ' + mode + '"><colgroup><col class="name">';
    info.forEach(function (x) { h += '<col class="dcol' + (x.closed && !week ? ' closed' : '') + '">'; });
    h += '<col class="tot"><col class="tot h"></colgroup><thead><tr class="r-date"><th class="name"><span class="small muted">職員 ＼ 日付</span></th>';
    info.forEach(function (x) {
      var label = week ? '<span class="d">' + (+x.d.slice(5, 7)) + '/' + (+x.d.slice(8, 10)) + '</span><span class="w">' + S.DOW[S.dow(x.d)] + '</span>'
        : '<span class="d">' + (+x.d.slice(8, 10)) + '</span><span class="w">' + S.DOW[S.dow(x.d)] + '</span>';
      var hol = S.holidayName(x.d);
      h += '<th class="dcol ' + x.cls + '" title="' + esc(hol || x.closed || '') + '"><button class="dhead" data-act="goday" data-date="' + x.d + '" aria-label="' + esc(S.mdLabel(x.d)) + 'の日表示">' + label + '</button></th>';
    });
    h += '<th class="tot">出勤<br>日数</th><th class="tot h">実働<br>時間</th></tr>';

    // 園全体の判定
    h += '<tr class="r-all"><th class="name"><span class="grp-name">園全体の配置</span></th>';
    info.forEach(function (x) {
      if (x.closed) { h += '<th class="dcol ' + x.cls + '">' + (week ? '<span class="small muted" style="padding:0 8px">' + esc(x.closed) + '</span>' : '') + '</th>'; return; }
      var ic = issueCountText(x.res);
      var title = ic.list.slice(0, 6).map(function (i) { return i.message; }).join('\n') || '終日充足';
      var inner;
      if (week) {
        inner = ck(x.res.worst, x.res.worst === 'short' ? '不足' + ic.short : x.res.worst === 'warn' ? '要確認' + ic.warn : '充足') +
          (ic.short && ic.warn ? ck('warn', String(ic.warn)) : '');
      } else {
        inner = ck(x.res.worst, x.res.worst === 'short' ? String(ic.short) : x.res.worst === 'warn' ? String(ic.warn) : '');
      }
      h += '<th class="dcol ' + x.cls + '"><button class="allck" data-act="goday" data-date="' + x.d + '" title="' + esc(title) + '">' + inner + '</button></th>';
    });
    h += '<th class="tot"></th><th class="tot h"></th></tr></thead><tbody>';

    groups.forEach(function (g) {
      // クラスの見出し行（その日のクラス判定）
      h += '<tr class="grp"><th class="name"><div class="grp-name">' + (g.cls ? '<span class="dot" style="background:' + esc(g.cls.color) + '"></span>' : '') + '<span>' + esc(g.label) + '</span></div>' +
        (g.cls ? '<div class="grp-name"><small>' + esc(classAgeText(g.cls)) + '</small></div>' : '') + '</th>';
      info.forEach(function (x) {
        if (x.closed || !g.cls) { h += '<td class="' + x.cls + '"></td>'; return; }
        var row = x.res.rows.filter(function (rr) { return rr.key === g.key; })[0];
        if (!row) { h += '<td class="' + x.cls + '"></td>'; return; }
        var iss = x.res.issues.filter(function (i) { return i.rowKey === g.key; });
        var title = iss.map(function (i) { return i.message; }).join('\n') || (row.worst === 'na' ? '合同保育（園全体で判定）' : 'クラス別保育の時間は充足');
        var inner = ck(row.worst, '', title);
        if (week && iss.length) {
          inner += iss.slice(0, 2).map(function (i) {
            return '<span class="txt' + (i.status === 'warn' ? ' w' : '') + '">' + esc(i.fromText) + '〜' + esc(i.toText) + (i.status === 'short' && i.why === 'count' ? ' −' + i.shortBy : ' 要確認') + '</span>';
          }).join('') + (iss.length > 2 ? '<span class="txt">他' + (iss.length - 2) + '件</span>' : '');
        } else if (week && row.worst === 'na') {
          inner = '<span class="small muted">合同保育</span>';
        }
        h += '<td class="' + x.cls + '"><button class="gck" data-act="goday" data-date="' + x.d + '" title="' + esc(title) + '">' + inner + '</button></td>';
      });
      h += '<td class="tot"></td><td class="tot h"></td></tr>';

      g.staff.forEach(function (s) {
        var days = 0, wmin = 0;
        h += '<tr class="srow"><th class="name"><div class="sname"><span class="n">' + esc(s.name) + '</span><span class="j">' + qualBadge(s) + '<span>' + esc(s.job || '') + '</span></span></div></th>';
        info.forEach(function (x) {
          var sh = getShift(x.d, s.id);
          if (sh && (sh.kind === K.WORK || sh.kind === K.TRAIN) && S.hasTimes(sh)) { days++; wmin += S.calcHours(sh).workMin; }
          if (x.closed && !sh) { h += '<td class="' + x.cls + '">' + (week ? '' : '') + '</td>'; return; }
          h += '<td class="' + x.cls + '">' + cellHTML(sh, s, x.d, week) + '</td>';
        });
        h += '<td class="tot">' + days + '</td><td class="tot h">' + hoursText(wmin) + '</td></tr>';
      });
    });

    // 出勤人数（保育に従事する職員）
    h += '<tr class="foot"><th class="name" style="text-align:left">出勤（保育従事）</th>';
    info.forEach(function (x) {
      if (x.closed) { h += '<td class="' + x.cls + '"></td>'; return; }
      var n = 0, all = 0;
      shiftsOn(x.d).forEach(function (sh) {
        var st = staffById(sh.staffId);
        if (sh.kind === K.WORK && S.hasTimes(sh)) { all++; if (st && S.bool(st.counted, false)) n++; }
      });
      h += '<td class="' + x.cls + '" title="出勤 ' + all + '名（うち保育従事 ' + n + '名）">' + n + (week ? '名 / 全' + all + '名' : '') + '</td>';
    });
    h += '<td class="tot"></td><td class="tot h"></td></tr>';
    h += '</tbody></table></div>';
    return h;
  }

  function cellHTML(sh, staff, date, week) {
    var data = ' data-act="cell" data-date="' + date + '" data-staff="' + esc(staff.id) + '"';
    if (!sh) return '<button class="cell empty"' + data + ' aria-label="' + esc(staff.name + ' ' + S.mdLabel(date) + ' 未入力') + '"><span class="plus">＋</span></button>';
    var ps = patStyle(sh);
    var stc = 'st-' + (STATUS_CLASS[sh.status] || 'draft');
    var badge = sh.status === ST.FIXED ? (week ? '✓確定' : '✓') : sh.status === ST.PENDING ? (week ? '承認待ち' : '待') : (week ? '変更中' : '変');
    var deleting = !sh.type && !S.hasTimes(sh);
    var labor = S.laborWarnings(sh).length ? ' warnlabor' : '';
    var style = 'background:' + (deleting ? '#fff' : ps.bg) + ';border-left-color:' + (deleting ? 'var(--line-strong)' : ps.bar);
    var label = esc(staff.name + ' ' + S.mdLabel(date) + ' ' + S.shiftText(sh) + ' ' + (sh.status || ''));
    var inner = '';
    if (deleting) {
      inner = '<span class="lv">削除予定</span>';
    } else if (!S.hasTimes(sh)) {
      inner = '<span class="lv">' + esc(sh.type) + '</span>';
    } else if (week) {
      inner = '<span class="tg">' + esc(sh.type) + '</span><span class="tm">' + esc(sh.start) + '〜' + esc(sh.end) + '</span>' +
        '<span class="sub">' + (sh.breakStart && Number(sh.breakMin) ? '休憩 ' + esc(sh.breakStart) + '〜' + esc(hm(S.toMin(sh.breakStart) + Number(sh.breakMin))) : (Number(sh.breakMin) ? '休憩' + sh.breakMin + '分' : '休憩なし')) + '</span>' +
        placementHTML(sh, staff, true);
    } else {
      inner = '<span class="tg">' + esc(ps.short) + '</span><span class="tm">' + esc(sh.start) + '〜</span><span class="tm">' + esc(sh.end) + '</span>' + placementHTML(sh, staff, false);
    }
    return '<button class="cell ' + stc + (deleting ? ' deleting' : '') + labor + '" style="' + style + '"' + data + ' aria-label="' + label + '" title="' + label + (sh.note ? '\n備考: ' + esc(sh.note) : '') + '">' + inner + '<span class="badge">' + badge + '</span></button>';
  }
  function placementHTML(sh, staff, week) {
    var segs = S.parseSegments(sh.segments);
    var moved = sh.classId && sh.classId !== (staff.classId || '');
    if (!segs.length && !moved) return '';
    if (segs.length) {
      var names = segs.map(function (g) { var c = classById(g.classId); return c ? c.name.replace('組', '') : g.classId; });

  function dayStaffListOnly(date) {

  function barHTML(sh, staff, open, span) {

    var out = !S.bool(staff.counted, false) || sh.kind === K.TRAIN;

    var len = en - st;
    var bs = S.toMin(sh.breakStart), bm = Number(sh.breakMin) || 0;

    var segs = S.parseSegments(sh.segments);

    var moved = !segs.length && sh.classId && sh.classId !== (staff.classId || '') ? (classById(sh.classId) || {}).name : '';

  // ------------------------------------------------------------------
  // かんたん入力（パターンを選んで、マスをタップしていく）
  // ------------------------------------------------------------------
  var queue = [], flushTimer = null;
  function renderQuickbar() {
    var q = $('#quick');
    if (!q) return;
    if (!state.quick || state.page !== 'facility') { q.innerHTML = ''; return; }
    var pats = patternsOf(state.facilityId);
    q.innerHTML = '<div class="quickbar" role="toolbar" aria-label="かんたん入力"><span class="title">かんたん入力</span><div class="chips">' +
      pats.map(function (p) {
        return '<button class="pat" data-act="qpat" data-name="' + esc(p.name) + '" aria-pressed="' + (state.quick === p.name) + '" style="border-left-color:' + esc(p.bar) + ';background:' + esc(p.bg) + '"><b>' + esc(p.name) + '</b><span>' + (p.start ? esc(p.start) + '〜' + esc(p.end) : '&nbsp;') + '</span></button>';
      }).join('') +
      '<button class="pat" data-act="qpat" data-name="__clear" aria-pressed="' + (state.quick === '__clear') + '" style="border-left-color:#999"><b>消す</b><span>&nbsp;</span></button>' +
      '</div><button class="btn primary" data-act="quick">終了</button></div>';
  }
  function usualTimes(staffId, type) {
    var best = null;
    Object.keys(state.shifts).forEach(function (id) {
      var s = state.shifts[id];
      if (s.staffId === staffId && s.type === type && S.hasTimes(s) && (!best || s.date > best.date)) best = s;
    });
    return best;
  }
  function suggestBreak(start, end, bm) {
    if (!bm) return '';
    var st = S.toMin(start), en = S.toMin(end);
    if (st === null || en === null) return '';
    var b = Math.max(st + 180, 12 * 60 + 30);
    if (b + bm > en - 60) b = st + Math.floor((en - st - bm) / 30) * 15;
    return hm(Math.round(b / 15) * 15);
  }
  function itemFromPattern(p, staff, date, cur) {
    if (!p) return { staffId: staff.id, date: date, clear: true };
    var it = { staffId: staff.id, date: date, type: p.name, kind: p.kind, start: p.start || '', end: p.end || '', breakMin: Number(p.breakMin) || 0, classId: staff.classId || '', segments: '', note: '' };
    var u = usualTimes(staff.id, p.name);
    if (u && (p.kind === K.WORK || p.kind === K.TRAIN)) { it.start = u.start; it.end = u.end; it.breakMin = Number(u.breakMin) || 0; }
    if (p.kind === K.WORK || p.kind === K.TRAIN) it.breakStart = suggestBreak(it.start, it.end, it.breakMin);
    else { it.start = ''; it.end = ''; it.breakMin = 0; it.breakStart = ''; }
    return it;
  }
  function quickApply(date, staffId) {
    var staff = staffById(staffId);
    var cur = getShift(date, staffId);
    if (state.quick === '__clear' && !cur) return;
    var p = state.quick === '__clear' ? null : patternOf(state.quick);
    var it = itemFromPattern(p, staff, date, cur);
    it.base = cur ? (cur._local ? cur._base : cur.editedAt || '') : '';
    // 画面にはすぐ反映（保存はまとめて行う）
    var local = cur ? clone(cur) : { id: date + '_' + staffId, facilityId: state.facilityId, date: date, staffId: staffId, staffName: staff.name };
    if (it.clear) { local.type = ''; local.kind = ''; local.start = ''; local.end = ''; local.breakMin = 0; local.breakStart = ''; }
    else Object.keys(it).forEach(function (k) { if (k !== 'base') local[k] = it[k]; });
    local.status = ST.DRAFT; local._local = true; local._base = it.base;
    state.shifts[local.id] = local;
    dirty([date]);
    queue = queue.filter(function (q) { return !(q.date === date && q.staffId === staffId); });
    queue.push(it);
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushQueue, 700);
    renderFacility();
  }
  function flushQueue() {
    if (!queue.length) return;
    var items = queue; queue = [];
    withEditor(function () {
      api('api_saveShifts', { token: state.token, editor: state.editor, facilityId: state.facilityId, items: items }).then(function (res) {
        items.forEach(function (it) {
          var id = it.date + '_' + it.staffId;
          if (state.shifts[id] && state.shifts[id]._local && !queue.some(function (q) { return q.date === it.date && q.staffId === it.staffId; })) delete state.shifts[id];
        });
        applySaved(res);
        if (res.conflicts && res.conflicts.length) {
          toast('他の人が先に変更していた ' + res.conflicts.length + ' 件は保存せず、最新の内容を表示しました。', 'err');
          res.conflicts.forEach(function (c) { if (c.current) state.shifts[c.id] = c.current; else delete state.shifts[c.id]; });
          dirty();
        } else {
          toast(items.length + '件を保存しました（変更中）', 'ok');
        }
        render();
      }).catch(function (e) {
        items.forEach(function (it) { var id = it.date + '_' + it.staffId; if (state.shifts[id] && state.shifts[id]._local) delete state.shifts[id]; });
        reloadRange(true);
        handleErr(e);
      });
    }, function () {
      items.forEach(function (it) { var id = it.date + '_' + it.staffId; if (state.shifts[id] && state.shifts[id]._local) delete state.shifts[id]; });
      reloadRange(true);
    });
  }

  // ---------- 勤務の編集 ----------
  function timeOptions(sel, from, to, allowEmpty) {
    var out = allowEmpty ? '<option value="">指定なし</option>' : '';
