<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイクの許可 - Gemini 文字起こし</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .perm { max-width: 460px; width: 100%; padding: 28px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .perm img { border-radius: 12px; }
    .perm h1 { font-size: 19px; margin: 14px 0 6px; }
    .perm p { color: var(--text-2); margin: 6px 0; }
    .perm .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .state { margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 13.5px; }
    .state.ok { background: var(--ok-soft); color: var(--ok); }
    .state.error { background: var(--rec-soft); color: var(--rec); }
    .state.wait { background: var(--accent-soft); color: var(--accent-text); }
    ol { color: var(--text-2); padding-left: 20px; margin: 8px 0 0; font-size: 13.5px; }
  </style>
</head>
<body>
  <main class="perm">
    <img src="icons/icon48.png" width="48" height="48" alt="">
    <h1>マイクの使用を許可してください</h1>
    <p>サイドパネルではマイクの許可ダイアログを表示できないため、このタブで一度だけ許可します。</p>
    <div id="state" class="state wait">ブラウザの許可ダイアログで「許可」を選んでください…</div>
    <ol id="deniedHelp" hidden>
      <li>アドレスバー左側のアイコン（サイト情報）をクリック</li>
      <li>「マイク」を「許可」に変更</li>
      <li>このページを再読み込み</li>
    </ol>
    <div class="actions">
      <button id="grant" class="btn primary" type="button">マイクを許可する</button>
      <button id="openSettings" class="btn" type="button" hidden>Chrome のマイク設定を開く</button>
      <button id="closeTab" class="btn" type="button" hidden>このタブを閉じる</button>
    </div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
