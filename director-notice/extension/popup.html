<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>本部からの重要なお知らせ</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; color: #202124; background: #fff; }
  header { background: #c5221f; color: #fff; padding: 10px 20px; font-size: 13px; font-weight: bold; letter-spacing: .05em; }
  main { flex: 1; overflow-y: auto; padding: 18px 20px; }
  h1 { font-size: 20px; line-height: 1.4; margin: 0 0 12px; overflow-wrap: anywhere; }
  #body { font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  #when { margin-top: 14px; font-size: 12px; color: #5f6368; }
  footer { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid #dadce0; background: #f8f9fa; }
  button, a.btn { font: inherit; font-size: 14px; font-weight: bold; padding: 9px 18px; border-radius: 6px; cursor: pointer; text-decoration: none; }
  a.btn { color: #1a73e8; border: 1px solid #dadce0; background: #fff; }
  #ack { color: #fff; background: #1a73e8; border: 1px solid #1a73e8; }
  #ack:disabled { opacity: .6; cursor: default; }
  button:focus-visible, a.btn:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>本部からの重要なお知らせ</header>
<main>
  <h1 id="title"></h1>
  <div id="body"></div>
  <div id="when"></div>
</main>
<footer>
  <a id="link" class="btn" target="_blank" rel="noopener noreferrer" hidden>詳細を開く</a>
  <button id="ack" type="button">確認しました</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
