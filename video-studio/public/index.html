<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Video Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d5efc'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo">▶</span><b>AI Video Studio</b></div>
      <input id="projectName" class="project-name" spellcheck="false" title="プロジェクト名" />
      <div class="spacer"></div>
      <span id="apiStatus" class="chip"></span>
      <button id="undoBtn" class="icon-btn" title="元に戻す (Ctrl+Z)">↶</button>
      <button id="redoBtn" class="icon-btn" title="やり直す (Ctrl+Shift+Z)">↷</button>
      <button id="settingsBtn" class="btn">⚙ 設定</button>
      <button id="exportBtn" class="btn primary">⬇ エクスポート</button>
    </header>

    <main class="workspace">
      <aside class="left-panel">
        <nav class="tabs" id="leftTabs">
          <button data-tab="generate" class="active">✨ AI生成</button>
          <button data-tab="library">🎞 ライブラリ</button>
          <button data-tab="narration">🎙 ナレーション</button>
        </nav>
        <section id="tab-generate" class="tab-body"></section>
        <section id="tab-library" class="tab-body hidden"></section>
        <section id="tab-narration" class="tab-body hidden"></section>
      </aside>

      <section class="center">
        <div class="stage-area" id="stageArea">
          <div class="stage" id="stage">
            <video class="layer" playsinline preload="auto"></video>
            <video class="layer" playsinline preload="auto"></video>
            <img class="layer" alt="" />
            <div class="stage-empty" id="stageEmpty">
              <div class="big">🎬</div>
              <div>左の「AI生成」で動画を作り、<br />「＋ タイムラインに追加」で編集を始めましょう</div>
            </div>
          </div>
        </div>
        <div class="transport">
          <button class="icon-btn" id="toStartBtn" title="先頭へ (Home)">⏮</button>
          <button class="icon-btn play" id="playBtn" title="再生 / 一時停止 (Space)">▶</button>
          <button class="icon-btn" id="toEndBtn" title="末尾へ (End)">⏭</button>
          <span class="timecode" id="timecode">00:00.0 / 00:00.0</span>
          <div class="spacer"></div>
          <label class="inline">比率
            <select id="aspectSelect">
              <option value="16:9">16:9 横</option>
              <option value="9:16">9:16 縦</option>
              <option value="1:1">1:1 正方形</option>
              <option value="4:5">4:5</option>
            </select>
          </label>
        </div>
      </section>

      <aside class="right-panel" id="inspector"></aside>
    </main>

    <section class="timeline" id="timeline"></section>

    <div id="modalRoot"></div>
    <div id="toasts"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
