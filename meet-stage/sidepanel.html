<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Meet Stage</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Meet Stage</h1>
    <span id="stage-badge" class="badge off">投影ウィンドウなし</span>
  </header>

  <section>
    <h2>投影ウィンドウ</h2>
    <p id="stage-hint" class="hint">相手やHDMI先に見せる専用ウィンドウです。ここに映すタブをサイドバーから切り替えます。</p>
    <div class="row">
      <button id="open-stage" class="primary">投影ウィンドウを開く</button>
      <button id="standby" hidden>待機画面(黒)</button>
      <button id="fullscreen" hidden>全画面 切替</button>
      <button id="close-stage" class="danger" hidden>閉じる</button>
    </div>
  </section>

  <section>
    <h2>Google Meet</h2>
    <div id="meet-list"></div>
  </section>

  <section>
    <h2>映す画面 <span class="sub">クリックで切り替え</span></h2>
    <ul id="stage-tabs" class="tabs"></ul>
    <div class="row add">
      <button id="add-capture">+ アプリのウィンドウ / 画面を追加</button>
    </div>
    <p class="hint">PowerPointなどChrome以外のウィンドウを映すときに使います。</p>
    <h3 id="other-title">その他のタブ <span class="sub">クリックで投影</span></h3>
    <ul id="other-tabs" class="tabs"></ul>
  </section>

  <div id="toast" role="status" hidden></div>
  <script src="sidepanel.js"></script>
</body>
</html>
