<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自社ARアプリ</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      #capture-btn {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: white;
        border: 4px solid #ff4d4d;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      #capture-btn:active {
        background-color: #f0f0f0;
        transform: translateX(-50%) scale(0.95);
      }
    </style>
  </head>
  <body>
    <div id="capture-btn">📸</div>

    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; keepSameTarget: true; warmupScore: 100;" 
      color-space="sRGB" 
      renderer="colorManagement: true; physicallyCorrectLights: true;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="my-logo" src="logo.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#CCC"></a-light>
      <a-light type="directional" color="#FFF" intensity="1.5" position="-1 1 2"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity rotation="90 0 0">
          <a-entity 
            gltf-model="#my-logo" 
            position="0 0 0" 
            scale="8 8 8" 
            animation-mixer>
          </a-entity>
        </a-entity>
      </a-entity>
      
    </a-scene>

    <script>
      document.getElementById('capture-btn').addEventListener('click', function() {
        // ★ 3D空間全体（sceneEl）を取得するように追加しました
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('video');
        const aframeCanvas = document.querySelector('.a-canvas');

        if (!video || !aframeCanvas || !sceneEl) {
          alert('カメラの準備ができていません');
          return;
        }

        const tempCanvas = document.createElement('canvas');
        const ctx = tempCanvas.getContext('2d');

        tempCanvas.width = aframeCanvas.width;
        tempCanvas.height = aframeCanvas.height;

        // ① まず、現実の風景（ビデオ映像）を描画する
        ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

        // ★ここが最強の解決策★
        // 描画バッファが消えるのを防ぐため、合成する「今この瞬間」に3Dを強制再描画する
        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

        // ② 強制再描画されて絶対に消えていないARロゴを重ねる
        ctx.drawImage(aframeCanvas, 0, 0, tempCanvas.width, tempCanvas.height);

        // 画像としてダウンロード
        const imageData = tempCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'ar-photo.png';
        link.href = imageData;
        link.click();
      });
    </script>
  </body>
</html>
